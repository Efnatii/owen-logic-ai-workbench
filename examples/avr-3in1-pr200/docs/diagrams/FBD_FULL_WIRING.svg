  <text x="675" y="924" class="wire-label">udiActive</text>
  <path class="wire" d="M655 962 H1018 V1148 H1030"/>
  <text x="675" y="952" class="wire-label">udiTarget</text>
  <path class="wire" d="M655 850 H965 V1316 H1030"/>
  <path class="wire" d="M655 878 H975 V1344 H1030"/>
  <path class="wire" d="M655 906 H985 V1372 H1030"/>
