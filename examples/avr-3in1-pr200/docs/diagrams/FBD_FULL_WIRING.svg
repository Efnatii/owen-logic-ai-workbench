  <path class="wire" d="M245 265 H305 V850 H340"/>
  <path class="wire" d="M245 322 H295 V878 H340"/>
  <path class="wire" d="M245 365 H285 V906 H340"/>
  <path class="wire" d="M245 408 H275 V934 H340"/>
